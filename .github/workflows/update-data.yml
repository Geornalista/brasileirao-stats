name: Atualizar Dados do Brasileirao

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verificar versao do Node
        run: node --version

      - name: Executar coleta FotMob
        run: npm run fetch

      - name: Processar estatisticas
        run: npm run process

      - name: Verificar arquivos gerados
        run: |
          echo "Arquivos em data:"
          find data -type f

      - name: Salvar dados atualizados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nos dados."
          else
            git commit -m "Atualizacao automatica dos dados do Brasileirao"
            git push
          fi
